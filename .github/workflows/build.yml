name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  android-and-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-35" "build-tools;36.0.0"
      - run: bash gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s desktop -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: lan-audio-debug
          path: app/build/outputs/apk/debug/app-debug.apk
  windows-sender:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r desktop/requirements-build.txt
      - run: ./desktop/build-windows.ps1 -Python python
      - name: Test packaged worker and desktop source
        shell: pwsh
        run: |
          $env:LAN_AUDIO_EXE = "$env:GITHUB_WORKSPACE/desktop/dist/LAN Audio.exe"
          python -m unittest discover -s desktop -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: lan-audio-windows
          path: desktop/dist/LAN Audio.exe
